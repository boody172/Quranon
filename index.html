<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0d">
  <meta name="description" content="قرآنون — استمع للقرآن الكريم بأصوات كل القراء، اقرأ المصحف، دروس قرآنية، واتجاه القبلة.">
  <title>قرآنون</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="رجوع" hidden>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="brand"><img src="icons/icon.svg" alt=""><span id="pageTitle">قرآنون</span></div>
    <button class="icon-btn" id="searchBtn" aria-label="بحث">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- المشغل المصغر -->
  <div class="mini-player" id="miniPlayer" hidden>
    <button class="mini-info" id="miniOpen">
      <div class="disc"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div class="mini-text"><b id="miniTitle"></b><small id="miniSub"></small></div>
    </button>
    <button class="icon-btn play" id="miniPlay" aria-label="تشغيل/إيقاف"></button>
    <div class="mini-progress"><i id="miniBar"></i></div>
  </div>

  <!-- المشغل الكامل -->
  <section class="sheet" id="playerSheet" aria-hidden="true">
    <div class="sheet-inner">
      <button class="grabber" id="sheetClose" aria-label="إغلاق"></button>
      <div class="art"><span id="artSurah"></span></div>
      <h2 id="pTitle"></h2>
      <p class="muted" id="pSub"></p>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="الموضع">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      <div class="controls">
        <button class="icon-btn" id="pRepeat" aria-label="تكرار"></button>
        <button class="icon-btn lg" id="pPrev" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg></button>
        <button class="icon-btn xl play" id="pPlay" aria-label="تشغيل/إيقاف"></button>
        <button class="icon-btn lg" id="pNext" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/></svg></button>
        <button class="icon-btn" id="pSpeed" aria-label="السرعة">1x</button>
      </div>
      <div class="sheet-actions">
        <button class="chip" id="pSleep">⏾ مؤقت النوم</button>
        <button class="chip" id="pRead">📖 اقرأ السورة</button>
        <a class="chip" id="pDownload" download target="_blank" rel="noopener">⬇ تحميل</a>
      </div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></a>
    <a href="#/listen" data-tab="listen"><svg viewBox="0 0 24 24"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg><span>استمع</span></a>
    <a href="#/mushaf" data-tab="mushaf"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v15c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v15"/></svg><span>المصحف</span></a>
    <a href="#/lessons" data-tab="lessons"><svg viewBox="0 0 24 24"><path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10v5c3 3 9 3 12 0v-5"/></svg><span>دروس</span></a>
    <a href="#/qibla" data-tab="qibla"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>القبلة</span></a>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <audio id="audio" preload="metadata"></audio>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
