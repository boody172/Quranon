<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4faf8">
  <meta name="description" content="قرآنون — استمع للقرآن الكريم بأصوات كل القراء، اقرأ المصحف، دروس قرآنية، واتجاه القبلة.">
  <title>Quranon</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="mask-icon" href="icons/logo.svg" color="#0f766e">
  <link rel="preload" href="fonts/plex-ar-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/alexandria-ar-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://mp3quran.net" crossorigin>
  <link rel="preconnect" href="https://api.alquran.cloud" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- fetch every module in parallel instead of discovering imports one level at a time -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/data.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/catalog.js">
  <link rel="modulepreload" href="js/account.js">
  <link rel="modulepreload" href="js/player.js">
  <link rel="modulepreload" href="js/sleep.js">
  <link rel="modulepreload" href="js/art.js">
  <link rel="modulepreload" href="js/qibla.js">
  <link rel="modulepreload" href="js/carplay.js">
  <link rel="modulepreload" href="js/ads.js">
  <link rel="modulepreload" href="js/views/home.js">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Top bar: back + title + one contextual button (home inside sections, account on the home screen). -->
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" data-i18n-label="nav.back" hidden><svg viewBox="0 0 24 24"><path class="flip" d="M9 6l6 6-6 6"/></svg></button>
    <a class="brand" href="#/home" id="brand" aria-label="Quranon">
      <img src="icons/logo.svg" alt="" width="34" height="34">
      <span id="pageTitle"></span>
    </a>
    <button class="icon-btn lang-btn" id="langBtn" aria-label="Language" data-i18n-label="nav.language"></button>
    <a class="icon-btn" id="accountBtn" href="#/account" aria-label="Account" data-i18n-label="nav.account" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
  </header>

  <div class="lang-menu" id="langMenu" hidden></div>
  <div class="update-banner" id="updateBanner" role="status" hidden><div><b></b><span></span></div><button class="pill soft"></button></div>

  <main id="view" class="view enter" tabindex="-1"></main>

  <!-- Mini player -->
  <div class="mini-player" id="miniPlayer" hidden>
    <button class="mini-info" id="miniOpen">
      <div class="disc"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div class="mini-text"><b id="miniTitle"></b><small id="miniSub"></small></div>
    </button>
    <button class="icon-btn fav" id="miniSleep" data-i18n-label="player.sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="icon-btn fav" id="miniFav" data-i18n-label="player.favorite" hidden></button>
    <button class="icon-btn play" id="miniPlay" data-i18n-label="player.playPause"></button>
    <div class="mini-progress"><i id="miniBar"></i></div>
  </div>

  <!-- Full player sheet -->
  <section class="sheet" id="playerSheet" aria-hidden="true">
    <div class="sheet-inner">
      <button class="grabber" id="sheetClose" data-i18n-label="common.close"></button>
      <div class="art"><span id="artSurah"></span></div>
      <h2 id="pTitle"></h2>
      <p class="muted" id="pSub"></p>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      <div class="controls">
        <button class="icon-btn" id="pRepeat" data-i18n-label="player.repeat"></button>
        <button class="icon-btn lg" id="pPrev" data-i18n-label="player.prev"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg></button>
        <button class="icon-btn xl play" id="pPlay" data-i18n-label="player.playPause"></button>
        <button class="icon-btn lg" id="pNext" data-i18n-label="player.next"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/></svg></button>
        <button class="icon-btn" id="pSleep" data-i18n-label="player.sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      </div>
      <div class="sleep-panel" id="sleepPanel" hidden>
        <div class="sleep-head"><b data-i18n-text="player.sleep"></b><small id="sleepState"></small></div>
        <div class="chips" id="sleepChips"></div>
      </div>
      <div class="sheet-actions">
        <button class="pill soft fav-pill" id="pFav" hidden></button>
        <button class="pill soft" id="pRead" data-i18n-text="player.read"></button>
      </div>
    </div>
  </section>

  <div class="nudge" id="nudge" role="status" hidden>
    <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <span></span><button class="pill primary" data-act></button>
    <button class="icon-btn small" data-close data-i18n-label="common.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <audio id="audio" preload="auto" playsinline></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
